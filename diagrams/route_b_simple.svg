<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1064" viewBox="0 0 1520 1064" role="img" aria-labelledby="title desc"><title id="title">Route B | LLM-Assisted Reward Design</title><desc id="desc">The team uses LLM feedback to design rewards, reviews changes, and starts PPO training. A validated neural policy is deployed alongside a fixed PID controller. Their outputs are summed and limited to control the motors. Simulation and robot logs feed the design process.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#20334E"/></marker></defs><rect width="1520" height="1064" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="760" y="73" font-size="43" font-weight="700" text-anchor="middle" fill="#142746">Route B | LLM-Assisted Reward Design</text><text x="760" y="117" font-size="23" font-weight="400" text-anchor="middle" fill="#526783">Non-harness: the team reviews LLM suggestions and starts PPO training.</text><path d="M 94 167 H 155" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="174" y="174" font-size="20" font-weight="400" text-anchor="start" fill="#142746">Real-time control</text><path d="M 415 167 H 476" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="495" y="174" font-size="20" font-weight="400" text-anchor="start" fill="#142746">Tuning / training / deployment</text><rect x="890" y="154" width="25" height="25" rx="5" fill="#F3EDFC" stroke="#9363CD"/><text x="926" y="174" font-size="19" font-weight="400" text-anchor="start" fill="#142746">LLM</text><rect x="1062" y="154" width="25" height="25" rx="5" fill="#FFF3E5" stroke="#E6A15B"/><text x="1098" y="174" font-size="19" font-weight="400" text-anchor="start" fill="#142746">Review / checks</text><rect x="1315" y="154" width="25" height="25" rx="5" fill="#EEF7EB" stroke="#779D66"/><text x="1351" y="174" font-size="19" font-weight="400" text-anchor="start" fill="#142746">Data</text><rect x="64" y="216" width="1392" height="293" rx="20" fill="#F3EDFC" fill-opacity="0.28" stroke="#9363CD" stroke-opacity="0.55" stroke-width="1.5"/><text x="92" y="254" font-size="20" font-weight="700" text-anchor="start" fill="#526783">PC  /  HUMAN-MEDIATED DESIGN + AUTOMATIC RL TRAINING</text><rect x="64" y="602" width="1392" height="350" rx="20" fill="#EEF5FF" fill-opacity="0.28" stroke="#5288D4" stroke-opacity="0.55" stroke-width="1.5"/><text x="92" y="640" font-size="20" font-weight="700" text-anchor="start" fill="#526783">STM32  /  REAL-TIME RESIDUAL CONTROL</text><path d="M 366 351 H 441" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 709 351 H 784" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 1052 351 H 1127" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><path d="M 1264 407 V 470 H 232 V 407" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="754" y="454" font-size="21" font-weight="400" text-anchor="middle" fill="#142746">Training results and evaluation metrics</text><path d="M 120 760 H 86 V 351 H 98" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="225" y="556" font-size="21" font-weight="400" text-anchor="middle" fill="#142746">Bluetooth logs</text><path d="M 1398 351 H 1488 V 907 H 634 V 864" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="1230" y="556" font-size="21" font-weight="400" text-anchor="middle" fill="#142746">Validated policy deployment</text><path d="M 350 760 H 419 V 694 H 500" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 419 760 V 818 H 500" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><circle cx="419" cy="760" r="4.5" fill="#20334E"/><path d="M 768 694 H 900 V 742 H 951" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M 768 818 H 900 V 781 H 951" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="830" y="679" font-size="18" font-weight="400" text-anchor="middle" fill="#142746">Base output</text><text x="830" y="847" font-size="18" font-weight="400" text-anchor="middle" fill="#142746">Correction</text><path d="M 1115 760 H 1182" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><g><rect x="98" y="295" width="268" height="112" rx="14" fill="#EEF7EB" stroke="#779D66" stroke-width="2"/><text x="232" y="348" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">Logs + metrics</text><text x="232" y="379" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Simulation and robot data</text></g><g><rect x="441" y="295" width="268" height="112" rx="14" fill="#F3EDFC" stroke="#9363CD" stroke-width="2"/><text x="575" y="348" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">Team + LLM</text><text x="575" y="379" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Design reward changes</text></g><g><rect x="784" y="295" width="268" height="112" rx="14" fill="#FFF3E5" stroke="#E6A15B" stroke-width="2"/><text x="918" y="348" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">Team review</text><text x="918" y="379" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Approve and start training</text></g><g><rect x="1127" y="295" width="271" height="112" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="1262.5" y="348" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">PPO train + test</text><text x="1262.5" y="379" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Learn and evaluate policy</text></g><g><rect x="120" y="710" width="230" height="100" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="235" y="757" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">Sensors</text><text x="235" y="788" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Robot state</text></g><g><rect x="500" y="648" width="268" height="92" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="634" y="691" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">Fixed PID</text><text x="634" y="722" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Frozen baseline</text></g><g><rect x="500" y="772" width="268" height="92" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="634" y="815" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">Neural policy</text><text x="634" y="846" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Trained bounded residual</text></g><g><rect x="951" y="710" width="164" height="100" rx="14" fill="#FFF3E5" stroke="#E6A15B" stroke-width="2"/><text x="1033" y="757" font-size="22" font-weight="600" text-anchor="middle" fill="#142746">Sum + limit</text><text x="1033" y="788" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Combine outputs</text></g><g><rect x="1182" y="710" width="230" height="100" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="1297" y="757" font-size="24" font-weight="600" text-anchor="middle" fill="#142746">Motors + robot</text><text x="1297" y="788" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Physical response</text></g><rect x="64" y="977" width="1392" height="58" rx="13" fill="#F3EDFC" stroke="#DFD1F0"/><text x="760" y="1014" font-size="23" font-weight="600" text-anchor="middle" fill="#142746">LLM output: reward-design suggestions   |   Deployed controller: fixed PID + trained neural policy</text></g></svg>