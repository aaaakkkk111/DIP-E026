stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="507" y="630" font-size="20" font-weight="400" text-anchor="middle" fill="#142746">Test feedback</text><text x="1010" y="630" font-size="20" font-weight="400" text-anchor="middle" fill="#142746">Candidate settings</text><g><rect x="120" y="279" width="270" height="108" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="255" y="330" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">Sensors</text><text x="255" y="361" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Robot state</text></g><g><rect x="625" y="279" width="270" height="108" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="760" y="330" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">PID / LQR</text><text x="760" y="361" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Local controller</text></g><g><rect x="1130" y="279" width="270" height="108" rx="14" fill="#EEF5FF" stroke="#5288D4" stroke-width="2"/><text x="1265" y="330" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">Motors + robot</text><text x="1265" y="361" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Physical response</text></g><g><rect x="120" y="596" width="270" height="108" rx="14" fill="#EEF7EB" stroke="#779D66" stroke-width="2"/><text x="255" y="647" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">Logs + metrics</text><text x="255" y="678" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Evaluate each test</text></g><g><rect x="625" y="596" width="270" height="108" rx="14" fill="#F3EDFC" stroke="#9363CD" stroke-width="2"/><text x="760" y="647" font-size="27" font-weight="600" text-anchor="middle" fill="#142746">LLM tuner</text><text x="760" y="678" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Propose parameter changes</text></g><g><rect x="1130" y="596" width="270" height="108" rx="14" fill="#FFF3E5" stroke="#E6A15B" stroke-width="2"/><text x="1265" y="647" font-size="26" font-weight="600" text-anchor="middle" fill="#142746">Validate + apply</text><text x="1265" y="678" font-size="20" font-weight="400" text-anchor="middle" fill="#405573">Accept or roll back</text></g><rect x="64" y="792" width="1392" height="58" rx="13" fill="#EEF5FF" stroke="#D1E2F8"/><text x="760" y="829" font-size="23" font-weight="600" text-anchor="middle" fill="#142746">LLM output: candidate settings   |   Deployed output: validated PID gains or LQR feedback gains</text></g></svg>