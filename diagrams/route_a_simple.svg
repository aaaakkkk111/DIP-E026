<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="880" viewBox="0 0 1520 880" role="img" aria-labelledby="title desc"><title id="title">Route A | LLM-Assisted Auto-Tuning</title><desc id="desc">A real-time STM32 controller receives validated parameter updates from an automatic PC loop of telemetry, LLM proposals and validation.</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M 1 1 L 11 6 L 1 11 z" fill="#20334E"/></marker></defs><rect width="1520" height="880" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="760" y="73" font-size="43" font-weight="700" text-anchor="middle" fill="#142746">Route A | LLM-Assisted Auto-Tuning</text><text x="760" y="117" font-size="23" font-weight="400" text-anchor="middle" fill="#526783">Harness: automated parameter proposals, validation and updates.</text><path d="M 94 167 H 155" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><text x="174" y="174" font-size="20" font-weight="400" text-anchor="start" fill="#142746">Real-time control</text><path d="M 415 167 H 476" fill="none" stroke="#20334E" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/><text x="495" y="174" font-size="20" font-weight="400" text-anchor="start" fill="#142746">Tuning / training / deployment</text><rect x="890" y="154" width="25" height="25" rx="5" fill="#F3EDFC" stroke="#9363CD"/><text x="926" y="174" font-size="19" font-weight="400" text-anchor="start" fill="#142746">LLM</text><rect x="1062" y="154" width="25" height="25" rx="5" fill="#FFF3E5" stroke="#E6A15B"/><text x="1098" y="174" font-size="19" font-weight="400" text-anchor="start" fill="#142746">Review / checks</text><rect x="1315" y="154" width="25" height="25" rx="5" fill="#EEF7EB" stroke="#779D66"/><text x="1351" y="174" font-size="19" font-weight="4