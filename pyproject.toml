[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "balance-bot-lab"
version = "0.1.0"
description = "Local safe lab for a two-wheel balancing robot"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ppo = ["stable-baselines3>=2.3", "gymnasium>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
balance-bot-lab = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
